<!DOCTYPE html>
<!--
  ZOO — Site institucional (portfólio da empresa)
  ============================================================
  Agora em React (Vite). Este arquivo é só a casca: o conteúdo
  inteiro é montado por src/main.jsx dentro de <div id="root">.

    - src/App.jsx              → a ordem das seções na página
    - src/components/sections  → uma seção por arquivo
    - src/data                 → textos e projetos (é aqui que se edita conteúdo)
    - src/styles/global.css    → toda a parte visual (cores, fontes, layout)
    - src/reactbits            → componentes trazidos do reactbits.dev

  O que ainda precisa de informação real antes de publicar:
    - Número de WhatsApp (hoje é um placeholder: 5581900000000)
    - CNPJ no rodapé (hoje está com valor fictício)
    - Preços da seção de planos (hoje são valores ilustrativos)
  Os três ficam em src/data/site.js.
  ============================================================
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOO — Estúdio de Sites</title>
<meta name="description" content="A Zoo cria sites institucionais, lojas virtuais e sistemas sob medida para pequenos e médios negócios em Recife e todo o Brasil. Projeto pensado do zero, no prazo, com suporte real depois da entrega.">
<meta name="theme-color" content="#0E0D0C">
<meta property="og:title" content="Zoo — Estúdio de Sites">
<meta property="og:description" content="Sites que vendem, não só existem. Construímos o site do seu negócio do zero — design próprio, sem template genérico.">
<meta property="og:type" content="website">
<!-- favicon = o coala do header, sem rosto -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='20' cy='20' r='15' fill='%23FF5A1F'/%3E%3Ccircle cx='80' cy='20' r='15' fill='%23FF5A1F'/%3E%3Ccircle cx='50' cy='56' r='36' fill='%23FF5A1F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<!-- as peças da logo da abertura já vêm no caminho: a tela de abertura é a
     primeira coisa na tela e não pode esperar imagem -->
<link rel="preload" as="image" href="/zoo-z.png">
<link rel="preload" as="image" href="/zoo-o.png">
<link rel="preload" as="image" href="/zoo-face-open.png">
<link rel="preload" as="image" href="/zoo-face-wink.png">
<!-- fundo certo antes de o React montar, pra não piscar branco -->
<style>
  html{ background:#0E0D0C; }
  html.theme-light{ background:#ECE5D8; }
</style>
<script>
  // aplica o tema salvo antes de a página pintar, pra não piscar escuro→claro
  // (quem troca o tema depois é o src/hooks/useTheme.js)
  try { if (localStorage.getItem('zoo-theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<noscript>Este site precisa de JavaScript para funcionar. Fale com a gente: zooseusite@gmail.com</noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
